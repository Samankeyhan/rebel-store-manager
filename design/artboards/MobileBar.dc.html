<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نوار بالای موبایل</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./rebel.css">
</head>
<body>
<x-dc>
<helmet>
<style>@font-face{font-family:'Vazirmatn';src:url('../assets/Vazirmatn-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}body{margin:0}</style>
</helmet>
<header class="rs" data-theme="{{theme}}" style="width: 390px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 4px; padding: 0 6px;">
<sc-if value="{{noBack}}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn btn-ghost btn-icon" style="width: 44px; height: 44px;" aria-label="باز کردن منو"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
</sc-if>
<sc-if value="{{back}}" hint-placeholder-val="{{ false }}">
<a href="{{backHref}}" class="btn btn-ghost btn-icon" style="width: 44px; height: 44px;" aria-label="بازگشت"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
</sc-if>
<div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px;">
<sc-if value="{{noBack}}" hint-placeholder-val="{{ true }}">
<img src="../assets/logo.png" alt="" style="width: 26px; height: 26px; border-radius: 50%; display: block;">
</sc-if>
<h1 class="t-h1" style="font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{title}}</h1>
</div>
<button type="button" class="btn btn-ghost btn-icon" style="width: 44px; height: 44px;" aria-label="جستجو"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
<button type="button" class="btn btn-ghost btn-icon" style="width: 44px; height: 44px;" aria-label="منوی کاربر"><span class="avatar">م</span></button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"خانه"},"back":{"editor":"boolean","default":false},"backHref":{"editor":"text","default":"OrdersMobile.dc.html"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    var back = this.props.back === true || this.props.back === 'true';
    return { title: this.props.title || 'خانه', back: back, noBack: !back, backHref: this.props.backHref || 'OrdersMobile.dc.html', theme: this.props.theme || 'light' };
  }
}
</script>
</body>
</html>
