<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;"><button type="button" class="btn btn-outline btn-lg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>ماده</button><button type="button" class="btn btn-primary btn-lg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>محصول</button></div>

<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["ready","empty","loading","error"],"default":"ready"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"h":{"editor":"int","default":1500},"$preview":{"width":390,"height":1500}}'>
var FA_D = '۰۱۲۳۴۵۶۷۸۹';
function fa(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  var neg = n < 0;
  var s = String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '٬').replace(/\d/g, function (d) { return FA_D[d]; });
  return (neg ? '−' : '') + s;
}
function faT(n) { return fa(n) + ' تومان'; }
function faD(s) { return String(s).replace(/\d/g, function (d) { return FA_D[d]; }); }
function num(v) {
  var s = String(v == null ? '' : v).replace(/[۰-۹]/g, function (d) { return FA_D.indexOf(d); }).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/[^0-9]/g, '');
  return s === '' ? 0 : parseInt(s, 10);
}

};

function orderRows(limit) {
  return ORDERS.slice(0, limit || ORDERS.length).map(function (o) {
    var pc = o[7] === null ? 'nil' : (o[7] < 0 ? 'neg' : 'pos');
    return {
      inv: o[0], date: faD(o[1]), time: faD(o[2]), dt: faD(o[1]) + ' · ' + faD(o[2]), ch: CH[o[3]].name, chCls: 'ch ' + CH[o[3]].cls, cust: o[4],

      profitT: o[7] === null ? 'سود: —' : 'سود ' + fa(o[7])
    };
  });
}
/* Jalali month grid, week starts Saturday. startIdx = weekday index of day 1 (0=Sat … 6=Fri). opt: {today, sel, from, to} */
function monthGrid(startIdx, days, opt) {
  opt = opt || {};
  var cells = [];
  for (var i = 0; i < startIdx; i++) cells.push({ l: '', c: 'cal-d x' });
  for (var d = 1; d <= days; d++) {
    var wd = (startIdx + d - 1) % 7, c = 'cal-d';
    if (wd === 6) c += ' fri';
    if (opt.today === d) c += ' today';
    if (opt.sel === d) c += ' sel';
    if (opt.from && opt.to) {
      if (d === opt.from) c += ' s';
      if (d === opt.to) c += ' e';
      if (d > opt.from && d < opt.to) c += ' in';
    }
    cells.push({ l: faD(d), c: c });
  }
  while (cells.length % 7) cells.push({ l: '', c: 'cal-d x' });
  return cells;
}
function faQ(n) { /* quantities: may be fractional, Persian decimal separator */
  if (n === null || n === undefined || isNaN(n)) return '—';
  var neg = n < 0, a = Math.abs(n), ip = Math.floor(a), fp = Math.round((a - ip) * 1000);
  var s = fa(ip).replace('−', '');
  if (fp) s += '٫' + faD(String(fp).padStart(3, '0').replace(/0+$/, ''));
  return (neg ? '−' : '') + s;
}
function numQ(v) { /* parse a possibly-fractional quantity typed in any digits */
  var s = String(v == null ? '' : v).replace(/[۰-۹]/g, function (d) { return FA_D.indexOf(d); }).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/[٫\/]/g, '.').replace(/[^0-9.]/g, '');
  var n = parseFloat(s); return isNaN(n) ? 0 : n;
}
function stateVals(props, defH) {
  var s = props.state || 'ready';
  return { theme: props.theme || 'light', h: props.h || defH, isReady: s === 'ready', isEmpty: s === 'empty', isLoading: s === 'loading', isError: s === 'error', st: s };
}

  { id: 'm2', name: 'کاور چاپی وینیل', type: 'goods', unit: 'عدد', stock: 45, cost: 180000, min: 20, use: 'تولید' },

function stockCls(stock, min) { return stock === 0 ? 'stock out' : (min && stock <= min ? 'stock low' : 'stock'); }

class Component extends DCLogic {
  renderVals() {
    return Object.assign(stateVals(this.props, 1500), {
      products: CATALOG.map(function (p) {
        return { name: p.name, cat: p.cat, stockT: p.stock === 0 ? 'ناموجود' : 'موجودی ' + fa(p.stock), stockCls: stockCls(p.stock, p.min),
          retailT: fa(p.retail), wsT: fa(p.ws), costT: p.cost == null ? 'بدون بهای تمام‌شده — قابل فروش نیست' : 'بهای تمام‌شده ' + fa(p.cost) + ' تومان',

      })
    });
  }
}
</script>
